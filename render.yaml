services:
  - type: web
    name: brain-tumor-detection
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python -c "import torch; print('PyTorch version:', torch.__version__)"
    startCommand: gunicorn main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: UPLOAD_FOLDER
        value: /tmp/uploads
      - key: DATABASE_URL
        value: sqlite:///instance/users.db
    disk:
      name: uploads
      mountPath: /tmp/uploads
      sizeGB: 1
    autoDeploy: true 